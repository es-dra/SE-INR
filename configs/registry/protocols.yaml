protocols:
  benchmark_discrete:
    status: active
    entrypoint: entrypoints/eval_full.py
    compatibility_entrypoint: eval_full.py
    datasets: [Set5, Set14, BSD100, Urban100]
    scales: [2, 3, 4, 6, 8, 12, 16, 24, 30]
    id_scales: [2, 3, 4]
    ood_scales: [6, 8, 12, 16, 24, 30]
    data_protocol: HR onsite bicubic downsampling via sr-implicit-downsampled
    checkpoint_rule: epoch-best.pth

  continuous_scale:
    status: active_but_needs_update
    entrypoint: entrypoints/eval_continuous.py
    compatibility_entrypoint: eval_continuous.py
    datasets: [Set5, Set14, BSD100, Urban100]
    caveat: Urban100 continuous raw has missing EQ entries in the current seed1 artifact.

  auxiliary_quality_consistency:
    status: active
    entrypoint: scripts/analysis/evaluate_seed1_aux_metrics.py
    compatibility_entrypoint: scripts/evaluate_seed1_aux_metrics.py
    current_artifact: artifacts/derived/analysis/seed1_aux_metrics_all8
    caveat: Current complete auxiliary evidence is seed1 and does not yet include final-candidate SC-INR (raw key SC-INR+PhiZ).

  qualitative_candidates:
    status: candidate
    entrypoint: scripts/viz/prepare_qualitative_figure.py
    compatibility_entrypoint: scripts/prepare_qualitative_figure.py
    current_artifact: artifacts/derived/paper_candidates/qualitative_phiz_candidates
    caveat: Auto-delta crops are candidate evidence and must be manually audited.
