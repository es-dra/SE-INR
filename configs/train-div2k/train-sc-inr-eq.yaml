# SC-INR-EQ exploratory branch
# Rot-E plumbing with the SC-INR decoder contract:
#   omega(z) = omega_bound * tanh(g(z))
#   phi(z) is predicted from features only, not from cell/scale
#   cell enters the decoder only through the analytic sinc response
#   LTE-EQ's learned phase(cell) is intentionally not used

train_dataset:
  dataset:
    name: image-folder
    args:
      root_path: ../Data/DIV2K_train_HR
      repeat: 20
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_max: 4
      augment: true
      sample_q: 2304
  batch_size: 16

val_dataset:
  dataset:
    name: image-folder
    args:
      root_path: ../Data/DIV2K_valid_HR
      first_k: 10
      repeat: 160
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_max: 4
      sample_q: 2304
  batch_size: 16

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

model:
  name: sc_inr_eq
  args:
    encoder_spec:
      name: edsr-eq-baseline
      args:
        no_upsampling: true
        kernel_size: 5
        res_scale: 0.1
    imnet_spec:
      name: e_mlp_lte
      args:
        out_dim: 3
        hidden_list: [256, 256, 256]
    hidden_dim: 256
    num_freqs: 128
    num_angles: 8
    freq_min: 0.1
    freq_max: 2.0
    omega_bound: 2.1
    learn_phase: true
    phase_kernel_size: 1
    phase_bias: false
    phase_zero_init: true
    use_sinc_response: true
    tranNum: 4
    kernel_size: 5

optimizer:
  name: adam
  args:
    lr: 1.e-4
epoch_max: 1000
multi_step_lr:
  milestones: [200, 400, 600, 800]
  gamma: 0.5

epoch_val: 1
epoch_save: 100
